events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 1. Serve the Status Page (Frontend)
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # 2. Route to FastAPI
        location /api {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }

        # 3. Route to Flask Actions
        location /actions {
            proxy_pass http://actions:5000;
            proxy_set_header Host $host;
        }
    }
}