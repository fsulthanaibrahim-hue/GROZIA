services:
  # 1. Nginx (Routes traffic)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

  # 2. Next.js Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    profiles: ["core"]

  # 3. FastAPI Backend
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      - AGENT_ENABLED=false
    depends_on:
      db:
        condition: service_healthy
    profiles: ["core", "ai"]

  # 4. Postgres Database
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shopops
      POSTGRES_PASSWORD: shopops_password
      POSTGRES_DB: grozia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopops -d grozia"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["core"]

  # 5. Flask Actions
  actions:
    build:
      context: ./services/actions
      dockerfile: Dockerfile
    profiles: ["core", "actions"]

  # 6. MongoDB (Agent Traces)
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: grozia_traces
    profiles: ["core", "ai"]

